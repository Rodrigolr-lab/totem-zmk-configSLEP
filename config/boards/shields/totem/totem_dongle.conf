# TOTEM dongle (central over USB): every dongle-only setting lives here, for
# both dongle artifacts. Split role / peripheral count / BT limits are set in
# Kconfig.defconfig. (Kconfig .conf lines take no trailing comments.)

# Battery: fetch both halves' levels and proxy them as an extra Battery Service
# with one Battery Level per half ("Peripheral 0/1"). ZMK_BATTERY_REPORTING stays
# on (ZMK_BLE implies it): at the pinned ZMK, =n leaves the peripheral battery
# event uncompiled and the proxy fails to link. So the dongle also has its own
# Battery Service with a meaningless level (no battery); the app ignores it.
# No idle/sleep setting: ZMK_SLEEP is off, so the dongle never deep-sleeps.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# ZMK Studio: live keymap editing in the browser over USB (https://studio.zmk.dev).
# The studio-rpc-usb-uart snippet (build.yaml) adds the USB transport; this turns
# Studio on. Unlock for editing with &studio_unlock (bound on the ADJ layer).
CONFIG_ZMK_STUDIO=y
