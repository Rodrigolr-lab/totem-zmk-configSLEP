# LEFT half = split CENTRAL (see Kconfig.defconfig). It runs the keymap, so this
# is where ZMK Studio belongs. The studio-rpc-usb-uart snippet in build.yaml adds
# the USB transport; this switch turns Studio itself on.
# Unlock for editing with &studio_unlock, bound on the ADJ layer (bottom-row
# far-left, the Z position).
CONFIG_ZMK_STUDIO=y
