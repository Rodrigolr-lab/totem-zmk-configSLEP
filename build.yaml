include:
  # DONGLE = the split CENTRAL (3rd XIAO on USB). It runs the keymap and owns
  # both halves. ZMK Studio runs on the central, so the snippet lives here.
  - board: xiao_ble//zmk
    shield: totem_dongle
    snippet: studio-rpc-usb-uart
  # Debug dongle: the stock dongle plus USB logging (read the log over the
  # dongle's USB serial port). No Studio snippet, so only one CDC-ACM UART.
  - board: xiao_ble//zmk
    shield: totem_dongle
    snippet: zmk-usb-logging
    artifact-name: totem_dongle_debug
  # LEFT and RIGHT halves = peripherals; they scan keys and report to the dongle.
  - board: xiao_ble//zmk
    shield: totem_left
  - board: xiao_ble//zmk
    shield: totem_right
  # settings_reset firmware: after a role change the old BLE bonds are stale,
  # so flash this to the left half, the right half and the dongle (last), then
  # the normal firmware to all three, and power them together to re-pair.
  - board: xiao_ble//zmk
    shield: settings_reset
